<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LizzaX.tech — En Construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #3535E5;
      --bg-dark: #2828C8;
      --white: #FFFFFF;
      --accent: #FF8B7A;
      --white-muted: rgba(255, 255, 255, 0.65);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(255, 139, 122, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(80, 60, 220, 0.4) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(40, 40, 200, 0.3) 0%, transparent 70%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle animated dots */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      animation: fadeIn 1s ease both;
      max-width: 700px;
      width: 100%;
    }

    /* ── Brand ── */
    .brand {
      line-height: 1;
      margin-bottom: 0.3em;
      letter-spacing: -1px;
    }

    .brand-lizza {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 900;
      color: var(--white);
      display: inline;
      text-shadow: 0 4px 30px rgba(0,0,0,0.25);
    }

    .brand-x {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 900;
      color: var(--accent);
      display: inline;
      text-shadow: 0 4px 30px rgba(255, 139, 122, 0.4);
    }

    .brand-tech {
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      font-weight: 700;
      color: var(--accent);
      opacity: 0.85;
      display: inline;
      vertical-align: middle;
      letter-spacing: 1px;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-size: clamp(1rem, 3.5vw, 1.6rem);
      font-weight: 300;
      color: var(--white);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0.9;
    }

    .subtitle span {
      display: inline-block;
      animation: blink 1.4s step-start infinite;
      color: var(--accent);
      font-weight: 700;
    }

    /* ── GIF ── */
    .gif-wrapper {
      display: inline-block;
      margin: 0 auto 2.5rem;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 0 80px rgba(255, 139, 122, 0.12);
      animation: float 4s ease-in-out infinite;
    }

    .gif-wrapper img {
      display: block;
      width: clamp(260px, 55vw, 420px);
      height: auto;
    }

    /* ── Footer text ── */
    .footer-text {
      font-size: clamp(0.75rem, 2.2vw, 0.92rem);
      font-weight: 300;
      color: var(--white-muted);
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .footer-text a {
      color: var(--white);
      font-weight: 400;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.35);
      transition: color 0.2s, border-color 0.2s;
    }

    .footer-text a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ── Divider ── */
    .divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 1.4rem;
      border-radius: 2px;
      opacity: 0.7;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="brand">
      <span class="brand-lizza">Lizza</span><span class="brand-x">X</span><span class="brand-tech">.tech</span>
    </div>

    <p class="subtitle">Está en construcción<span>.</span></p>

    <div class="gif-wrapper">
      <img src="assets/under-construction.gif" alt="Sitio en construcción" />
    </div>

    <div class="divider"></div>

    <p class="footer-text">
      Pronto tendremos novedades, por mientras escríbenos a<br />
      <a href="mailto:lizza.x.company@gmail.com">lizza.x.company@gmail.com</a>
    </p>

  </div>
</body>
</html>
